<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111a33" />
    <link rel="icon" type="image/svg+xml" href="/finsight-mark.svg" />
    <link rel="apple-touch-icon" href="/finsight-mark.svg" />
    <title>FinSight — Financial Intelligence OS</title>
    <script>
      (() => {
        try {
          const theme = localStorage.getItem('finsight_theme') || 'dark';
          const resolved = theme === 'system'
            ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
            : theme;
          document.documentElement.dataset.theme = theme;
          document.documentElement.dataset.resolvedTheme = resolved;
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
